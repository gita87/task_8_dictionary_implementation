[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qaos-dictionary"
version = "1.0.0"
description = "QAOS dictionary/1.0 DOCX-to-CSV conversion library"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "qaos-common==0.2.2",
  "defusedxml>=0.7,<1",
  "Pillow>=12.3,<13",
  "lxml>=5,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
ui = [
  "Flask>=3.1,<4",
  "gunicorn>=23,<24",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.16,<0.17",
  "mypy>=2.3,<3",
  "types-lxml>=2026.2",
  "types-defusedxml>=0.7",
  "build>=1.2,<2",
  "twine>=7,<8",
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
]

[project.scripts]
qaos-dictionary = "qaos_dictionary.cli:main"

[tool.setuptools]
py-modules = ["cli", "dict_docx_to_csv", "wsgi"]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["qaos_dictionary*", "app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]
qaos_dictionary = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["sandbox"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.coverage.run]
branch = true
source = ["qaos_dictionary", "app"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.bandit]
exclude_dirs = ["tests"]
